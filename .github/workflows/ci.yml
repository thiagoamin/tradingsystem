name: Project Orion CI
on:
  pull_request:

jobs:
  clang-format:
    name: Check C++ Code Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Clang 22
        uses: egor-tensin/setup-clang@v2
        with:
          version: '22'
          platform: 'x64'

      - name: Format code
        run: python3 scripts/utilities/fix_formatting.py

      - name: Check for differences
        run: git --no-pager diff --color --exit-code

  build-dev:
    name: Build Trading Engine Binary
    runs-on: ubuntu-latest
    needs: [clang-format]
    container:
      image: ghcr.io/philam2001/projectorion-ci:dev
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
 
      - name: Build
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel

  run-test:
    name: Test Trading Engine
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/philam2001/projectorion-ci:dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      

      - name: Build and run tests
        run: |
          cmake --preset test
          cmake --build --preset test --parallel
          cd build_test && ctest --output-on-failure